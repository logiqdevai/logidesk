<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Gatherly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/auth.css">
</head>
<body>
  <div class="auth">
    <main class="auth-form">
      <a class="brand" href="../index.html" style="padding:0"><svg viewBox="0 0 24 24" fill="none" stroke="#cc785c" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/></svg><span class="brand-name">Gatherly</span></a>
      <h1>Reset your password</h1>
      <p class="muted">Enter your email and we'll send a reset link.</p>
      <form class="col gap-4 mt-5" id="f" onsubmit="document.getElementById('f').classList.add('hidden');document.getElementById('sent').classList.remove('hidden');return false;">
        <div class="field"><label for="e">Email</label><input id="e" class="input" type="email" required></div>
        <button class="btn block" type="submit">Send reset link</button>
      </form>
      <div id="sent" class="callout ok mt-5 hidden"><div><b>Check your inbox</b><div class="muted">If an account exists for that email, a reset link is on its way.</div></div></div>
      <p class="muted mt-5"><a href="login.html">Back to sign in</a></p>
    </main>
    <aside class="auth-side"><h2>It happens to everyone.</h2><p class="quote">Reset links are single-use and expire after one hour.</p></aside>
  </div>
</body>
</html>
